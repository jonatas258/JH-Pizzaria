
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar | JH Pizzaria</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="auth-layout">

        <aside class="auth-visual">
            <a class="brand" href="index.html">— JH — PIZZARIA</a>

            <div class="auth-quote">
                “Pizza boa é aquela que reúne pessoas ao redor da mesa.”
                <small>— Família JH Pizzaria</small>
            </div>
        </aside>

        <section class="auth-panel">
            <div class="auth-inner">

                <a class="text-link" href="index.html">
                    ← Voltar ao início
                </a>

                <span class="eyebrow" style="display:block; margin-top:30px">
                    Faça parte da família JH
                </span>

                <h2>Crie sua conta</h2>

                <div class="auth-tabs">
                    <a href="login.html">Entrar</a>
                    <a class="active" href="cadastro.html" aria-current="page">
                        Cadastrar
                    </a>
                </div>

                <form id="registerForm" action="#" method="post">

                    <div class="form-control">
                        <label for="nome">Seu nome</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            autocomplete="name"
                            placeholder="Como podemos chamar você?"
                            required
                        >
                    </div>

                    <div class="form-control">
                        <label for="telefone">Telefone</label>
                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            autocomplete="tel"
                            placeholder="(31) 99999-9999"
                            required
                        >
                    </div>

                    <div class="form-control">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            placeholder="voce@email.com"
                            required
                        >
                    </div>

                    <div class="form-control">
                        <label for="senha">Senha</label>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            autocomplete="new-password"
                            minlength="8"
                            placeholder="Mínimo de 8 caracteres"
                            required
                        >
                    </div>

                    <button
                        class="btn btn-primary"
                        type="submit"
                        style="width:100%"
                    >
                        Criar minha conta
                    </button>

                    <p class="muted" style="font-size:.8rem; margin-top:18px">
                        Ao continuar, você concorda com os termos de uso.
                    </p>

                </form>
            </div>
        </section>

    </main>

    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    ></div>

    <script src="app.js"></script>
</body>
</html>
