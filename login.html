
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | JH Pizzaria</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-layout">

        <aside class="auth-visual">

            <a class="brand" href="index.html">
                — JH — PIZZARIA
            </a>

            <div class="auth-quote">
                “Pizza boa é aquela que reúne pessoas ao redor da mesa.”

                <small>— Família JH Pizzaria</small>
            </div>

        </aside>

        <section class="auth-panel">

            <div class="auth-inner">

                <a class="text-link" href="index.html">
                    ← Voltar ao início
                </a>

                <span class="eyebrow" style="display:block; margin-top:30px">
                    Que bom ter você por aqui
                </span>

                <h2>Entre na sua conta</h2>

                <div class="auth-tabs">

                    <a class="active" href="login.html" aria-current="page">
                        Entrar
                    </a>

                    <a href="cadastro.html">
                        Cadastrar
                    </a>

                </div>

                <form id="loginForm" action="#" method="post">

                    <div class="form-control">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            placeholder="voce@email.com"
                            required
                        >

                    </div>

                    <div class="form-control">

                        <label for="password">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="senha"
                            autocomplete="current-password"
                            placeholder="Sua senha"
                            required
                        >

                    </div>

                    <div class="check-row">

                        <label>
                            <input
                                type="checkbox"
                                id="remember"
                                name="lembrar"
                            >
                            Lembrar de mim
                        </label>

                        <a class="text-link" href="#" id="forgotPassword">
                            Esqueci minha senha
                        </a>

                    </div>

                    <button
                        class="btn btn-primary"
                        type="submit"
                        style="width:100%">
                        Entrar
                    </button>

                    <p class="muted" style="font-size:.8rem; margin-top:18px">
                        Ainda não tem conta?

                        <a class="text-link" href="cadastro.html">
                            Cadastre-se
                        </a>
                    </p>

                </form>

            </div>

        </section>

    </main>

    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite">
    </div>

    <script src="app.js"></script>

</body>
</html>
